version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mental-prompt-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Mount untuk development - file changes langsung keliatan
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      # Keep container's vendor & node_modules (jangan di-override host)
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_NAME=MentalPrompt
      - APP_ENV=local
      - APP_KEY=base64:Jj72A/yEuYdcSeq76DnnUdwDmCZ5FRW8gIu/3ILDdcc=
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=mental_prompt
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=file
      - OCTANE_SERVER=roadrunner
      - SKIP_DB_CHECK=true
      - AUTO_MIGRATE=false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mental-prompt-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: npm run dev
    volumes:
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./public:/var/www/html/public
      - ./package.json:/var/www/html/package.json
      - ./package-lock.json:/var/www/html/package-lock.json
      - ./vite.config.js:/var/www/html/vite.config.js
      - ./tailwind.config.js:/var/www/html/tailwind.config.js
      - /var/www/html/vendor
      - /var/www/html/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: mental-prompt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mental-prompt-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mental_prompt
      MYSQL_USER: mentalprompt
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
